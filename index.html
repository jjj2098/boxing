<style>

<script>
(()=>{
'use strict';
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));

/* ---------- 상대 선수 ---------- */

 {id:'leon',name:'번개 레온',nick:'광속의 잽',weight:'웰터급',record:'21승 4패',skin:'#c98d62',skinD:'#8a5636',trunk:'#f2c14e',trunk2:'#1b1b1b',glove:'#2b6fe0',hair:'mohawk',hairC:'#141010',build:.92,

/* ---------- 오디오 ---------- */
let AC=null,master,NB,crowdG,crowdF,muted=!!save.muted;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  master=AC.createGain();master.gain.value=.75;master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);
  let b=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b=.97*b+.03*w;d[i]=w*.6+b*3}
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  crowdF=AC.createBiquadFilter();crowdF.type='bandpass';crowdF.frequency.value=650;crowdF.Q.value=.6;

function env(g,t,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.006+dur)}

  if(!aok())return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  env(g,t,peak,dur);o.connect(g).connect(master);o.start(t);o.stop(t+dur+.05);
}
function nz(dur,peak,ft,freq,q=1,f2=null,delay=0){
  if(!aok())return;const t=AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);f.Q.value=q;
  const g=AC.createGain();env(g,t,peak,dur);s.connect(f).connect(g).connect(master);s.start(t,Math.random()*1.4);s.stop(t+dur+.05);
}

function resize(){
  const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  G.u=Math.min(H/620,W/360);G.oppY=H*.53;buildCrowd();
}
function buildCrowd(){
  crowd=[];for(let row=0;row<4;row++){const y=H*(.13+row*.062),r=(8+row*2.4)*Math.max(.8,G.u);const n=Math.ceil((W+300)/(r*2.3));
    for(let i=0;i<n;i++)crowd.push({x:-150+i*r*2.3+rand(-r*.4,r*.4),y:y+rand(-3,3),r:r*rand(.85,1.1),row,ph:rand(0,TAU),c:randi(0,3)})}
}
new ResizeObserver(resize).observe(cv);resize();

/* ---------- 선수 상태 ---------- */
let P,O;
function newPlayer(){return{hp:100,hpShow:100,sta:100,star:0,dodge:0,dodgeT:0,dodgeCD:0,dodgeOff:0,guard:false,punch:null,buf:null,tired:0,kds:0,hurtT:0,gp:{L:{x:0,y:0},R:{x:0,y:0}}}}
function mkPose(){return{bx:0,by:0,lean:0,hx:0,hy:0,sc:1,lg:{x:-58,y:-118,s:1},rg:{x:58,y:-118,s:1},face:'normal'}}
function newOpp(def){
  return{def,hp:def.hp,hpShow:def.hp,state:'idle',t:rand(...def.idle)+.6,dur:1,atk:'L',feint:false,resolved:false,result:null,
    guard:def.guard==='swap'?'L':def.guard==='both'?'both':'none',baseGuard:def.guard==='swap'?'L':def.guard==='both'?'both':'none',gT:def.guardSwap,gut:0,bodyRow:0,lowT:0,hitBody:false,kds:0,combo:0,chainN:0,vuln:0,firstCounter:false,
    flinch:0,hitSide:1,glint:0,getUpAt:5,blockRow:0,pose:mkPose()};
}
const guardHeld={k:false,b:false};
const useHint=()=>O&&(O.def.hint||save.hintAll);

/* ---------- 텍스트·이펙트 ---------- */
function say(s,o={}){G.texts.push({s,x:o.x??W/2,y:o.y??H*.42,t:0,life:o.life??.9,size:o.size??38,col:o.col??'#f2c14e',rise:o.rise??30})}
function burst(x,y,n,col,spd=260,sz=4){for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(.3,1)*spd;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:rand(.35,.7),t:0,col,r:rand(sz*.5,sz*1.3)})}}
function ring(x,y,col,max){G.rings.push({x,y,t:0,col,max})}
function kick(sh,fl=0,col='255,255,255',stop=0){G.shake=Math.max(G.shake,RM?sh*.3:sh);if(fl){G.flash=Math.max(G.flash,fl);G.flashC=col}if(stop)G.hitstop=Math.max(G.hitstop,stop)}
function cheer(v){G.crowd=Math.min(1,G.crowd+v);for(let i=0;i<v*14;i++)flashes.push({x:rand(0,W),y:rand(H*.1,H*.36),t:rand(-.3,0)})}
function oppBody(){const u=G.u,p=O.pose;return{x:W/2+G.camX+p.bx*u,y:G.oppY+(p.by+38*p.sc)*u}}
function oppHead(){const u=G.u,p=O.pose;return{x:W/2+G.camX+(p.bx+p.hx*.9)*u,y:G.oppY+(p.by+(-150+p.hy)*p.sc)*u}}

/* ---------- 경기 흐름 ---------- */
function startFight(i){
  G.foeIdx=i;O=newOpp(FOES[i]);P=newPlayer();
  G.round=1;G.stats={hits:0,body:0,counters:0,perfect:0,kdFor:0,kdAgainst:0,taken:0,blocked:0};G.ppts=0;G.opts=0;G.fightT=0;
  G.introName=true;beginRound();
}
function beginRound(){
  G.time=60;G.scene='intro';G.introT=0;G.belled=false;G.rs={hits:0,taken:0,blocked:0};
  O.state='idle';O.t=1.2;O.combo=0;O.vuln=0;O.gut=0;O.lowT=0;O.bodyRow=0;P.punch=null;P.dodge=0;P.tired=0;P.buf=null;
  hideOv();document.getElementById('topbtns').hidden=false;
}
function roundOver(){
  G.scene='break';sfx.bell(3);cheer(.5);P.punch=null;P.dodge=0;
  setTimeout(()=>{if(G.scene!=='break')return;if(G.round>=3)decision();else showBreak()},1300);
}
function decision(){
  const j=[0,1,2].map(()=>({me:Math.round(G.ppts+rand(-3,3)),op:Math.round(G.opts+rand(-3,3))}));
  let w=0,l=0;j.forEach(c=>{if(c.me>c.op)w++;else if(c.op>c.me)l++});
  finish(w>l,w>l?'판정승':w===l?'무승부':'판정패',j);
}
function finish(win,method,judges=null){
  G.scene='result';G.method=method;document.getElementById('topbtns').hidden=true;
  let grade=null;
  if(win){
    const ko=method!=='판정승';
    grade=ko?(P.hp>=70&&G.stats.kdAgainst===0&&G.round===1?'S':G.stats.kdAgainst===0?'A':'B'):(P.hp>=40?'B':'C');
    const order='CBAS',prev=save.best[O.def.id];
    if(!prev||order.indexOf(grade)>order.indexOf(prev))save.best[O.def.id]=grade;
    save.unlocked=Math.max(save.unlocked,Math.min(FOES.length,G.foeIdx+2));persist();
  }
  setTimeout(()=>showResult(win,method,grade,judges),win?300:500);
}

/* ---------- 입력 동작 ---------- */
function canAct(){return G.scene==='fight'&&!G.paused}
function dodge(dir){
  if(!canAct()||P.dodge!==0||P.dodgeCD>0||P.punch||P.hurtT>0)return;
  P.dodge=dir;P.dodgeT=0;sfx.whoosh();
}
function punch(side,body=false){
  if(G.scene==='count'&&G.who==='me'){mash();return}
  if(!canAct())return;
  if(P.punch||P.dodge!==0||P.hurtT>0){P.buf={side,body,t:.18};return}
  if(P.tired>0){say('헉... 헉...',{size:22,col:'#9fd2ff',y:H*.7,life:.6});return}
  P.punch={side,body,t:0,dur:body?.27:.24,hit:false,star:false};P.sta-=body?8:7;sfx.swing();
  if(P.sta<=0){P.sta=0;P.tired=1.6;sfx.tired();say('지쳤다!',{size:26,col:'#9fd2ff',y:H*.68})}
}
function starPunch(){
  if(G.scene==='count'&&G.who==='me'){mash();return}
  if(!canAct()||P.star<1||P.punch||P.dodge!==0||P.tired>0||P.hurtT>0)return;
  P.punch={side:1,t:0,dur:.56,hit:false,star:true,n:P.star};P.star=0;sfx.star();
}
function mash(){G.mash+=1;G.shake=Math.max(G.shake,3);sfx.ui()}

/* ---------- 상대 AI ---------- */
function pickAtk(d){const e=Object.entries(d.atk).filter(x=>x[1]>0);let r=Math.random()*e.reduce((s,x)=>s+x[1],0);for(const[k,w]of e){if((r-=w)<=0)return k}return e[0][0]}
function startAttack(type,dur,canFeint=true){
  O.state='windup';O.atk=type;O.t=0;O.dur=dur;O.feint=canFeint&&Math.random()<O.def.feint;O.glint=.28;O.resolved=false;sfx.glint();
}
function chooseAttack(){const d=O.def,a=pickAtk(d);startAttack(a,d.windup[a]*(1+(Math.random()*2-1)*d.windVar))}
function resolveStrike(){
  const a=O.atk,dmg=O.def.dmg[a];
  const need=a==='L'?1:a==='R'?-1:0;
  const active=P.dodge!==0&&P.dodgeT>.03&&P.dodgeT<.47;
  const h=oppHead();
  if(active&&(need===0||P.dodge===need)){
    O.result='miss';
    if(P.dodgeT<.2){G.stats.perfect++;if(P.star<3){P.star++;say('퍼펙트 회피! ★',{size:30,y:H*.6})}else say('퍼펙트 회피!',{size:30,y:H*.6})}
    else say('회피!',{size:28,col:'#9fd2ff',y:H*.6});
    sfx.whoosh();cheer(.15);return;
  }
  if(P.guard&&a!=='U'){
    O.result='block';P.hp-=dmg*.18;P.sta-=20;G.stats.blocked++;sfx.block();kick(6,.15,'160,200,255');
    burst(W/2,H*.72,10,'#bfe1ff',220,3);say('가드',{size:24,col:'#bfe1ff',y:H*.66,life:.5});
    if(P.sta<=0){P.sta=0;P.tired=1.6;sfx.tired();say('가드가 무너졌다!',{size:26,col:'#9fd2ff',y:H*.6})}
  }else{
    O.result='hit';
    let d=dmg;if(P.guard&&a==='U'){d*=.7;say('가드 브레이크!',{size:30,col:'#ff8a6a',y:H*.6})}
    if(P.punch)d*=1.2;
    P.hp-=d;P.hurtT=.38;P.punch=null;P.buf=null;G.stats.taken++;G.rs.taken++;G.opts+=2;
    if(P.star>0){P.star--;say('★ 하나를 잃었다',{size:18,col:'#ffb3a3',y:H*.74,life:.8})}
    G.hurtVig=1;sfx.hit(1.25);kick(a==='U'?24:16,.35,'255,40,30',.07);cheer(.25);
    burst(W/2+rand(-30,30),H*.45,14,'#ffe0d0',300,4);
  }
  if(P.hp<=0){P.hp=0;playerDown()}
}
function afterStrike(){
  const d=O.def;
  if(O.result==='miss'){O.state='recover';O.t=d.recover;O.vuln=d.recover;O.firstCounter=true;O.combo=0;O.chainN=0;return}
  if(Math.random()<d.chain&&O.chainN<2){O.chainN++;const a=pickAtk(d);startAttack(a,d.windup[a]*.55,false);return}
  O.chainN=0;O.state='idle';O.t=rand(...d.idle)*.8;
}
function updateOpp(dt){
  const d=O.def;
  O.vuln=Math.max(0,O.vuln-dt);O.flinch-=dt;O.glint-=dt;
  O.gut=Math.max(0,O.gut-7*dt);O.bodyRow=Math.max(0,O.bodyRow-.45*dt);
  if(d.guard==='swap'&&O.state==='idle'){O.gT-=dt;if(O.gT<=0){O.baseGuard=O.baseGuard==='L'?'R':'L';O.gT=d.guardSwap*rand(.7,1.3)}}
  if(O.lowT>0){O.lowT-=dt;if(O.lowT<=0)say('가드를 다시 올렸다',{size:18,col:'#c9c2cf',y:H*.33,life:.6})}
  O.guard=O.lowT>0?'low':O.baseGuard;
  switch(O.state){
    case'idle':O.t-=dt;if(O.t<=0)chooseAttack();break;
    case'windup':
      O.t+=dt;
      if(O.feint&&O.t>=O.dur*.62){O.state='idle';O.t=rand(.25,.5);say('페인트',{size:20,col:'#c9c2cf',y:H*.33,life:.6});break}
      if(O.t>=O.dur){O.state='strike';O.t=0;O.resolved=false;sfx.swing()}
      break;
    case'strike':O.t+=dt;if(!O.resolved&&O.t>=.07){O.resolved=true;resolveStrike()}if(O.state==='strike'&&O.t>=.22)afterStrike();break;
    case'recover':O.t-=dt;if(O.t<=0){O.state='idle';O.t=rand(.35,.7);O.vuln=0}break;
    case'hurt':
      O.t-=dt;if(O.t<=0){
        if(O.combo>=d.maxCombo){O.state='block';O.t=.6;O.vuln=0;say('가드를 굳혔다',{size:20,col:'#c9c2cf',y:H*.33,life:.7})}
        else if(O.vuln>0){O.state='recover';O.t=O.vuln}
        else{O.state='idle';O.t=rand(.3,.65)}
      }break;
    case'block':O.t-=dt;if(O.t<=0){O.combo=0;const a=Math.random()<.5?'J':pickAtk(d);startAttack(a,Math.max(.32,d.windup[a]*.5),false)}break;
    case'gasp':case'stun':O.t-=dt;if(O.t<=0){O.state='idle';O.t=.5;O.vuln=0;O.combo=0}break;
    case'getup':O.t-=dt;if(O.t<=0){O.state='idle';O.t=1}break;
  }
}

/* ---------- 내 펀치 판정 ---------- */
function landPunch(p){
  const st=O.state,d=O.def,h=oppHead(),u=G.u;
  if(st==='down'||st==='getup')return;
  const bp=oppBody(),body=!p.star&&!!p.body;
  const hx=body?bp.x+p.side*30*u:h.x+(p.star?0:p.side*14*u),hy=body?bp.y:h.y+10*u;
  if(p.star){
    let dmg=10+12*p.n;
    if(O.guard==='both'&&O.vuln<=0&&st==='idle'){dmg*=.6;say('가드 파괴!',{size:30,y:H*.3})}
    O.hp-=dmg;G.ppts+=4*p.n;G.stats.hits++;G.rs.hits++;
    say(p.n>=3?'★★★ 스타 어퍼!':'★ 스타 펀치!',{size:44,y:H*.3,life:1.1});
    sfx.hit(1.8);kick(26,.6,'255,240,200',.14);cheer(.7);burst(hx,hy,30,'#ffe9a8',420,5);ring(hx,hy,'255,220,120',140*u);
    O.hitSide=0;if(O.hp<=0){oppDown();return}
    O.state='stun';O.t=1.5;O.vuln=1.5;O.firstCounter=false;O.combo=0;return;
  }
  let mult=1,label=null,flinch=true;
  const vul=O.vuln>0||st==='stun'||st==='gasp';
  if(st==='windup'){
    const prog=O.t/O.dur;
    if(d.armor){mult=.5;flinch=false;label='슈퍼아머';}
    else if(d.interrupt&&prog<.45){mult=1.5;label='인터럽트!';if(P.star<3)P.star++;G.stats.counters++}
    else flinch=false;
  }else if(st==='strike'){flinch=false}
  else if(vul){mult=st==='stun'||st==='gasp'?1.35:1.7;if(O.firstCounter){O.firstCounter=false;label='카운터!';G.stats.counters++;if(P.star<3){P.star++;label='카운터! ★'}}}
  else if(st==='block'||(body?(O.guard==='low'||(O.guard==='L'&&p.side>0)||(O.guard==='R'&&p.side<0)):(O.guard==='both'||(O.guard==='L'&&p.side<0)||(O.guard==='R'&&p.side>0)))){
    sfx.block();burst(hx,hy,8,'#f2c14e',200,3);P.sta-=4;O.blockRow++;G.stats.blocked++;G.rs.blocked++;
    say('막힘',{x:hx,y:hy-20*u,size:20,col:'#c9c2cf',life:.45,rise:18});
    if(O.blockRow>=3&&st==='idle'){O.blockRow=0;startAttack('J',.34,false)}
    return;
  }
  O.blockRow=0;
  const dmg=(body?4+Math.random()*1.6:5+Math.random()*2)*mult;
  O.hp-=dmg;O.combo++;G.stats.hits++;G.rs.hits++;G.ppts+=mult>1.2?2:1;O.hitBody=body;
  if(body){G.stats.body++;O.gut+=d.gutGain*(mult>1.2?1.5:1);O.bodyRow++;sfx.body()}else sfx.hit(mult>1.2?1.3:.9);kick(mult>1.2?10:5,mult>1.2?.18:0,'255,255,255',mult>1.2?.06:.035);
  burst(hx,hy,mult>1.2?16:8,'#e8f4ff',260,3.5);ring(hx,hy,'255,255,255',(mult>1.2?80:50)*u);
  cheer(mult>1.2?.2:.06);
  if(label)say(label,{size:label.startsWith('인터')?34:38,y:H*.3});
  if(O.combo>=3)say(O.combo+' 연타',{x:W*.78,y:H*.5,size:26,col:'#ffffff',life:.6,rise:14});
  O.hitSide=p.side;
  if(O.hp<=0){oppDown();return}
  if(body&&O.gut>=100&&!(d.armor&&st==='windup')){
    O.gut=0;O.bodyRow=0;O.lowT=0;O.state='gasp';O.t=1.3;O.vuln=1.3;O.firstCounter=false;O.combo=0;
    if(P.star<3)P.star++;say('복부 강타! ★',{size:40,y:H*.3});say('숨이 막힌다!',{size:22,col:'#ffb36b',y:H*.38,life:1});
    kick(12,.2,'255,170,80',.08);cheer(.4);return;
  }
  if(body&&O.bodyRow>=d.bodyReact&&O.lowT<=0&&st!=='windup'){O.lowT=rand(2,2.8);O.bodyRow=0;say('가드가 내려갔다! 얼굴을 노려!',{size:22,col:'#ffd27a',y:H*.38,life:1.1})}
  if(flinch){if(st==='windup'){O.state='hurt';O.t=.32}else if(st!=='stun'&&st!=='gasp'){O.state='hurt';O.t=.24}}
  else O.flinch=.12;
}

/* ---------- 다운 ---------- */
function oppDown(){
  O.hp=0;O.kds++;G.stats.kdFor++;G.ppts+=8;P.punch=null;P.buf=null;
  O.state='down';G.slow=.25;G.slowT=.9;kick(28,.7,'255,255,255',.15);sfx.boom();cheer(1);
  if(O.kds>=3){G.scene='ko';G.koT=2.6;G.who='opp';say('T.K.O.!',{size:72,y:H*.36,life:2.4,rise:6});return}
  say('DOWN!',{size:64,y:H*.34,life:1.2,rise:8});
  G.scene='count';G.who='opp';G.count=0;G.countT=-.7;
  O.getUpAt=O.kds===1?randi(3,6):randi(6,9);
}
function playerDown(){
  P.kds++;G.stats.kdAgainst++;G.opts+=8;P.punch=null;P.dodge=0;P.buf=null;
  O.state='idle';O.t=99;kick(20,.6,'255,30,20',.1);sfx.boom();cheer(.8);
  if(P.kds>=3){G.scene='ko';G.koT=2.6;G.who='me';say('T.K.O.',{size:64,y:H*.36,col:'#ff6b5a',life:2.4,rise:6});return}
  say('DOWN!',{size:60,col:'#ff6b5a',y:H*.34,life:1.1,rise:8});
  G.scene='count';G.who='me';G.count=0;G.countT=-.6;G.mash=0;G.need=P.kds===1?10:17;
}
function updateCount(dt){
  G.countT+=dt;
  if(G.who==='me'){G.mash=Math.max(0,G.mash-1.6*dt);if(G.mash>=G.need){
    P.hp=P.kds===1?55:35;G.scene='fight';P.hurtT=.4;P.sta=100;P.tired=0;O.state='idle';O.t=1.3;
    say('다시 일어섰다!',{size:36,col:'#9fd2ff'});cheer(.6);return}}
  if(G.countT>=.85){G.countT-=.85;G.count++;sfx.tick();
    if(G.who==='opp'&&G.count>=O.getUpAt&&G.count<10){
      O.hp=O.def.hp*(O.kds===1?.55:.35);O.hpShow=O.hp;O.state='getup';O.t=.9;O.combo=0;O.vuln=0;
      G.scene='fight';say(O.def.name+' 기립!',{size:28,col:'#c9c2cf'});cheer(.3);return}
    if(G.count>=10){G.scene='ko';G.koT=2;say('K.O.!',{size:80,y:H*.36,col:G.who==='opp'?'#f2c14e':'#ff6b5a',life:2,rise:6});cheer(1);sfx.bell(3)}
  }
}

/* ---------- 업데이트 ---------- */
function updatePlayer(dt){
  if(P.dodge!==0){P.dodgeT+=dt;if(P.dodgeT>=.5){P.dodge=0;P.dodgeCD=.12}}
  P.dodgeCD-=dt;P.hurtT-=dt;
  if(P.tired>0){P.tired-=dt;if(P.tired<=0){P.tired=0;P.sta=45}}
  else if(!P.punch)P.sta=Math.min(100,P.sta+(P.guard?9:20)*dt);
  P.guard=(guardHeld.k||guardHeld.b)&&!P.punch&&P.dodge===0;
  const p=P.punch;
  if(p){p.t+=dt;if(!p.hit&&p.t>=(p.star?.3:.085)){p.hit=true;landPunch(p)}if(P.punch&&p.t>=p.dur)P.punch=null}
  if(P.buf){P.buf.t-=dt;if(P.buf.t<=0)P.buf=null;else if(!P.punch&&P.dodge===0&&P.hurtT<=0&&P.tired<=0){const s=P.buf.side,bd=P.buf.body;P.buf=null;punch(s,bd)}}
}
function targetPose(){
  const st=O?O.state:'idle',t=G.t,p=mkPose();
  p.by=Math.sin(t*4.2)*4;p.bx=Math.sin(t*1.7)*9;p.hx=Math.sin(t*1.7+.6)*3;
  const g=st==='block'?'both':O.guard;
  if(g==='both'){p.lg={x:-27,y:-150,s:1.12};p.rg={x:27,y:-150,s:1.12}}
  else if(g==='L'){p.lg={x:-26,y:-148,s:1.1};p.rg={x:84,y:-52,s:1}}
  else if(g==='R'){p.rg={x:26,y:-148,s:1.1};p.lg={x:-84,y:-52,s:1}}
  else if(g==='low'){p.lg={x:-44,y:6,s:1.05};p.rg={x:44,y:6,s:1.05};p.hy=4}
  else{p.lg={x:-76,y:-78,s:1};p.rg={x:76,y:-78,s:1}}
  const a=O.atk;
  if(st==='windup'){
    p.face='angry';
    if(a==='L'){p.lg={x:-158,y:-70,s:.88};p.lean=-.17;p.bx-=16;p.hx+=6}

function updatePose(dt){
  if(!O)return;const tg=targetPose(),st=O.state;

  const a=O.pose;
  for(const q of['bx','by','lean','hx','hy','sc'])a[q]+=(tg[q]-a[q])*k;
  for(const gk of['lg','rg'])for(const q of['x','y','s'])a[gk][q]+=(tg[gk][q]-a[gk][q])*k;
  a.face=tg.face;
}
function updateFx(dt,rdt){
  G.shake*=Math.exp(-12*rdt);G.flash=Math.max(0,G.flash-rdt*2.6);G.hurtVig=Math.max(0,G.hurtVig-rdt*1.8);
  G.crowd+=(.25-G.crowd)*(1-Math.exp(-.6*rdt));

  for(const q of G.parts){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=700*dt}G.parts=G.parts.filter(q=>q.t<q.life);

  for(const f of flashes)f.t+=rdt;flashes=flashes.filter(f=>f.t<.18);

}
function update(dt,rdt){
  G.t+=dt;updateFx(dt,rdt);

    P.hpShow+=(P.hp-P.hpShow)*(1-Math.exp(-3*rdt));
  }
  if(O)O.hpShow+=(O.hp-O.hpShow)*(1-Math.exp(-3*rdt));

  const tilt=(G.scene==='count'||G.scene==='ko')&&G.who==='me'?.32:0;G.tilt+=(tilt-G.tilt)*(1-Math.exp(-4*rdt));

  }else if(G.scene==='fight'){

}

    if(P.guard){x=cx+s*44*u+off;y=H*.74;sc=1.28}
    if(P.tired>0){y+=36*u;rot=s*.2;y+=Math.sin(t*6)*4*u}
    if(P.hurtT>0){x+=rand(-6,6)*u;y+=rand(-3,6)*u}
    if(P.dodge){rot+=P.dodgeOff*.2}
    const p=P.punch;let trail=false;
    if(p&&p.side===s){
      const pr=clamp(p.t/p.dur,0,1);
      if(p.star){
        if(pr<.45){const k=easeOut(pr/.45);x=lerp(x,cx+30*u,k);y=lerp(y,H+20*u,k);sc=1.1}
        else{const k=pr<.62?easeOut((pr-.45)/.17):1-easeOut((pr-.62)/.38);x=lerp(cx+30*u,h.x,k);y=lerp(H+20*u,h.y+20*u,k);sc=lerp(1.1,.62,k);trail=pr<.75}
      }else{
        const k=pr<.4?easeOut(pr/.4):1-easeOut((pr-.4)/.6);
        const b=oppBody(),tx=p.body?b.x+s*30*u:h.x+s*14*u,ty=p.body?b.y:h.y+14*u;
        x=lerp(x,tx,k);y=lerp(y,ty,k);sc=lerp(sc,p.body?.66:.56,k);
      }
    }
    if(trail){for(let i=1;i<=4;i++){ctx.globalAlpha=.16;drawGlove(ctx,x+(i*4)*u,y+i*26*u,R*sc,'#d4271f',-s);}ctx.globalAlpha=1}
    const fx=x+s*70*u,fy=H+60*u;
    ctx.strokeStyle='#c48f69';ctx.lineCap='round';ctx.lineWidth=46*u*sc;ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(x+s*6*u,y+R*sc*.8);ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=14*u*sc;ctx.beginPath();ctx.moveTo(fx+s*12*u,fy);ctx.lineTo(x+s*16*u,y+R*sc*.8);ctx.stroke();
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);
    drawGlove(ctx,0,0,R*sc,'#d4271f',-s,p&&p.star?.8:0);
    ctx.fillStyle='#f2c14e';ctx.fillRect(-R*sc*.56,R*sc*.6,R*sc*1.12,R*sc*.08);
    ctx.restore();
  }
}
function drawHint(){

/* ---------- HUD ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function bar(x,y,w,h,show,val,col,dir){
  ctx.fillStyle='rgba(0,0,0,.55)';rr(x-2,y-2,w+4,h+4,4);ctx.fill();
  const ws=w*clamp(show,0,1),wv=w*clamp(val,0,1);
  ctx.fillStyle='#fff';ctx.fillRect(dir>0?x:x+w-ws,y,ws,h);
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,shade(col,.35));g.addColorStop(1,shade(col,-.25));
  ctx.fillStyle=val<.3&&Math.sin(G.t*12)>0?'#ff5a46':g;ctx.fillRect(dir>0?x:x+w-wv,y,wv,h);
  ctx.fillStyle='rgba(0,0,0,.35)';for(let i=1;i<10;i++)ctx.fillRect(x+w*i/10,y,1,h);
}
function drawHUD(){
  if(!P||G.scene==='title')return;

  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(pad,top+35,bw*.7,5);
  ctx.fillStyle=P.tired>0?'#ff8a6a':'#7fe07a';ctx.fillRect(pad,top+35,bw*.7*P.sta/100,5);
  for(let i=0;i<3;i++)star5(pad+8+i*20,top+56,8,i<P.star?'#f2c14e':'rgba(255,255,255,.14)');
  for(let i=0;i<P.kds;i++){ctx.fillStyle='#ff6b5a';ctx.fillRect(pad+bw-10-i*12,top+35,8,5)}
  ctx.textAlign='right';ctx.fillStyle='#d9d1c6';ctx.fillText(O.def.name,W-pad,top+11);
  bar(W-pad-bw,top+17,bw,bh,O.hpShow/O.def.hp,O.hp/O.def.hp,'#f2c14e',-1);
  for(let i=0;i<O.kds;i++){ctx.fillStyle='#f2c14e';ctx.fillRect(W-pad-bw+i*12,top+35,8,5)}
  const gw=bw*.6,gk=Math.min(1,O.gut/100);
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(W-pad-gw,top+35,gw,5);
  ctx.fillStyle=gk>.75&&Math.sin(G.t*14)>0?'#ffe08a':'#ff9a3c';ctx.fillRect(W-pad-gw*gk,top+35,gw*gk,5);
  ctx.font=`600 10px ${FB}`;ctx.textAlign='right';ctx.fillStyle=O.lowT>0?'#ffd27a':'#a99a8c';ctx.fillText(O.lowT>0?'가드 내려감!':'복부',W-pad,top+52);
  const tw=70,tx=W/2-tw/2;
  ctx.fillStyle='#120e16';rr(tx,top,tw,46,8);ctx.fill();ctx.strokeStyle='#3a3142';ctx.lineWidth=1;ctx.stroke();
  ctx.textAlign='center';ctx.fillStyle='#f2c14e';ctx.font=`600 10px ${FB}`;ctx.fillText(`${G.round} 라운드`,W/2,top+14);
  const s=Math.ceil(Math.max(0,G.time));ctx.font=`26px ${FD}`;ctx.fillStyle=s<=10?'#ff6b5a':'#f3ede3';
  ctx.fillText(`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`,W/2,top+40);
}
function star5(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*.45:r;ctx.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2)}ctx.fill()}
function txt(s,x,y,size,col,stroke=true){
  ctx.font=`${size}px ${FD}`;ctx.textAlign='center';ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=size*.16;ctx.strokeStyle='rgba(10,6,12,.9)';ctx.strokeText(s,x,y)}
  ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.textBaseline='alphabetic';
}
function drawCenter(){
  const u=G.u;
  if(G.scene==='intro'){
    const s=G.introName?2:0,t=G.introT;
    if(t<s){const k=Math.min(1,t/.35),out=t>s-.3?(s-t)/.3:1;
      ctx.save();ctx.globalAlpha=out;ctx.fillStyle='rgba(8,6,10,.78)';ctx.fillRect(0,H*.3,W,H*.24);
      ctx.fillStyle='#c0322b';ctx.fillRect(0,H*.3,W*k,4);ctx.fillRect(W*(1-k),H*.54-4,W*k,4);
      txt('홍코너',W/2,H*.35,16*u,'#f2c14e',false);txt(O.def.name,W/2-(1-k)*W*.4,H*.415,Math.min(46*u,W/7),'#f3ede3');
      ctx.font=`italic 15px ${FB}`;ctx.fillStyle='#c9c2cf';ctx.textAlign='center';ctx.fillText(`${O.def.weight} · ${O.def.record} · “${O.def.quote}”`,W/2,H*.5);ctx.restore()}
    else if(t<s+1){const k=(t-s);txt(`${G.round} 라운드`,W/2,H*.42,(54+(1-Math.min(1,k*4))*30)*u,'#f3ede3')}
    else txt('FIGHT!',W/2,H*.42,(70+Math.max(0,.2-(t-s-1))*200)*u,'#f2c14e');
  }
  if(G.scene==='count'){
    if(G.count>0)txt(String(G.count),W/2,H*.42,(110-Math.min(1,G.countT/.15)*20+20)*u,G.who==='opp'?'#f3ede3':'#ff6b5a');

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sx=(Math.random()*2-1)*G.shake,sy=(Math.random()*2-1)*G.shake;
  ctx.save();
  ctx.translate(W/2+sx,H*.6+sy);ctx.rotate((P?P.dodgeOff*.035:0)+G.tilt);ctx.translate(-W/2,-H*.6+(G.tilt*H*.25));
  drawArena();
  if(O)drawOpp();
  for(const q of G.parts){ctx.globalAlpha=1-q.t/q.life;ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;
  for(const r of G.rings){const k=r.t/.35;ctx.strokeStyle=`rgba(${r.col},${1-k})`;ctx.lineWidth=6*(1-k)+1;ctx.beginPath();ctx.arc(r.x,r.y,r.max*easeOut(k),0,TAU);ctx.stroke()}
  ctx.restore();
  if(P&&G.scene!=='title'&&!(G.who==='me'&&(G.scene==='count'||G.scene==='ko')))drawPlayer();
  const v=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.3,W/2,H*.45,Math.max(W,H)*.75);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(${G.hurtVig>0?'90,0,0':'0,0,0'},${.55+G.hurtVig*.3})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  if(P&&P.hp<30&&G.scene==='fight'){ctx.fillStyle=`rgba(160,0,0,${.08+.06*Math.sin(G.t*6)})`;ctx.fillRect(0,0,W,H)}
  if(G.flash>0){ctx.fillStyle=`rgba(${G.flashC},${Math.min(.7,G.flash)})`;ctx.fillRect(0,0,W,H)}
  if(O&&G.scene!=='title'){drawHint();drawHUD()}
  for(const s of G.texts){const k=s.t/s.life,pop=s.t<.12?lerp(1.6,1,s.t/.12):1;ctx.save();ctx.globalAlpha=k>.7?(1-k)/.3:1;
    txt(s.s,s.x,s.y-s.rise*easeOut(k),s.size*G.u*pop,s.col);ctx.restore()}
  drawCenter();
}

/* ---------- 루프 ---------- */
let last=performance.now();
function loop(now){
  const raw=Math.min(.05,(now-last)/1000);last=now;
  if(!G.paused){
    let dt=raw;
    if(G.hitstop>0){G.hitstop-=raw;dt=0}
    if(G.slowT>0){G.slowT-=raw;dt*=G.slow}
    update(dt,raw);
  }
  render();audioTick();
  if(P){starBtn.classList.toggle('ready',P.star>0&&G.scene==='fight')}
  requestAnimationFrame(loop);
}

  const b=e.target.closest('[data-go]');if(!b||b.disabled)return;audioInit();sfx.ui();
  const go=b.dataset.go;
  if(go==='select'){G.paused=false;showSelect()}
  else if(go==='title')showTitle();
  else if(go==='resume'){G.paused=false;hideOv();last=performance.now()}
  else if(go==='nextround'){G.round++;beginRound()}
  else if(go.startsWith('fight:'))startFight(+go.slice(6));
});

/* ---------- 입력 ---------- */
function act(a,down){
  if(a==='guard'){guardHeld.b=down;return}
  if(!down)return;
  if(a==='dl')dodge(-1);else if(a==='dr')dodge(1);else if(a==='pl')punch(-1);else if(a==='pr')punch(1);else if(a==='bl')punch(-1,true);else if(a==='br')punch(1,true);else if(a==='star')starPunch();
}
const deck=document.getElementById('deck');
deck.addEventListener('pointerdown',e=>{const b=e.target.closest('.pad');if(!b)return;e.preventDefault();audioInit();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('on');act(b.dataset.act,true)});
const padUp=e=>{const b=e.target.closest('.pad');if(!b)return;b.classList.remove('on');act(b.dataset.act,false)};
['pointerup','pointercancel','lostpointercapture'].forEach(t=>deck.addEventListener(t,padUp));
deck.addEventListener('contextmenu',e=>e.preventDefault());
deck.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')e.preventDefault()});

let sw=null;
cv.addEventListener('pointerdown',e=>{audioInit();sw={x:e.clientX,y:e.clientY,t:performance.now()}});
cv.addEventListener('pointerup',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(G.scene==='count'&&G.who==='me'){mash();return}
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))dodge(dx<0?-1:1);
  else if(dy<-50)starPunch();
  else if(Math.abs(dx)<20&&Math.abs(dy)<20){const r=cv.getBoundingClientRect();punch(e.clientX-r.left<r.width/2?-1:1,e.clientY-r.top>G.oppY-20*G.u)}
});
const KEY={ArrowLeft:'dl',KeyA:'dl',ArrowRight:'dr',KeyD:'dr',KeyJ:'pl',KeyZ:'pl',KeyK:'pr',KeyX:'pr',KeyN:'bl',KeyM:'br',Space:'star',KeyL:'star',KeyC:'star'};
addEventListener('keydown',e=>{
  if(!ov.hidden){if(e.key==='Escape'&&G.paused){G.paused=false;hideOv();last=performance.now()}return}
  if(e.code==='Escape'||e.code==='KeyP'){showPause();return}
  if(e.code==='ArrowDown'||e.code==='KeyS'){guardHeld.k=true;e.preventDefault();return}
  const a=KEY[e.code];if(!a)return;e.preventDefault();if(e.repeat)return;audioInit();act(a,true);
});
addEventListener('keyup',e=>{if(e.code==='ArrowDown'||e.code==='KeyS')guardHeld.k=false});
addEventListener('blur',()=>{guardHeld.k=false;guardHeld.b=false;if(G.scene==='fight')showPause()});
document.getElementById('bPause').addEventListener('click',showPause);
const sndBtn=document.getElementById('bSound');
function paintSound(){sndBtn.style.opacity=muted?.45:1;sndBtn.setAttribute('aria-pressed',String(!muted))}
sndBtn.addEventListener('click',()=>{audioInit();muted=!muted;save.muted=muted;persist();paintSound()});
paintSound();

/* ---------- 시작 ---------- */
O=newOpp(FOES[0]);P=null;
showTitle();
requestAnimationFrame(loop);
})();
</script>

</body></html>
